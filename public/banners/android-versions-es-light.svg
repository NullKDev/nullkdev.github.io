<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Banner de Android, versión por versión, con el robot de Android.">
  <defs>
    <linearGradient id="bg-android-versions-es-light" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <radialGradient id="glow-android-versions-es-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00875A" stop-opacity="0.08800000000000001"/>
      <stop offset="100%" stop-color="#00875A" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift-android-versions-es-light" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#00875A" flood-opacity="0.11"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-android-versions-es-light)"/>
  <ellipse cx="960" cy="300" rx="360" ry="270" fill="url(#glow-android-versions-es-light)"/>
<g filter="url(#lift-android-versions-es-light)"><image x="730" y="130" width="370" height="370" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/></g>
  <rect x="96" y="150" width="76" height="4" rx="2" fill="#00875A"/>
  <text x="96" y="205" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="26" letter-spacing="4" fill="#00875A">API 19–37 · 2013–2026</text>
  <text x="96" y="318" font-family="Switzer,'Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="600" letter-spacing="-3" fill="#0F172A">Android</text>
  <text x="96" y="392" font-family="Switzer,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="500" letter-spacing="-1" fill="#475569">Versión por versión</text>
  <text x="96" y="470" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#55617A">18 versiones · de KitKat a Cinnamon Bun</text>
