<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Android 17 memory limits banner — a process killed with no stack trace">
  <defs>
    <linearGradient id="mem-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="3B1E1E"/>
    </linearGradient>
    <linearGradient id="mem-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mem-bg)"/>

  <!-- Safe band: y=75..555. Nothing legible may leave it. -->
  <g opacity="0.10"><rect x="700" y="130" width="420" height="70" rx="10" fill="#F87171"/><rect x="700" y="220" width="420" height="70" rx="10" fill="#F87171"/><rect x="700" y="310" width="290" height="70" rx="10" fill="#F87171"/><rect x="700" y="400" width="150" height="70" rx="10" fill="#F87171"/></g>

  <rect x="96" y="150" width="76" height="4" rx="2" fill="url(#mem-accent)"/>
  <text x="96" y="205" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="26" letter-spacing="4" fill="#F87171">ANDROID 17 · MEMORY</text>
  <text x="96" y="300" font-family="Switzer,'Helvetica Neue',sans-serif" font-size="72" font-weight="500" letter-spacing="-2" fill="#F8FAFC">Killed with no</text>
  <text x="96" y="384" font-family="Switzer,'Helvetica Neue',sans-serif" font-size="72" font-weight="500" letter-spacing="-2" fill="#94A3B8">stack trace</text>
  <text x="96" y="470" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#64748B">cgroup memory.high · MemoryLimiter:AnonSwap</text>
</svg>
