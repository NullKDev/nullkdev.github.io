<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Android 4.4 KitKat banner, with the version logo.">
  <defs>
    <linearGradient id="bg-android-4-4-kitkat" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B2B22"/>
    </linearGradient>
    <radialGradient id="glow-android-4-4-kitkat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00875A" stop-opacity="0.22000000000000003"/>
      <stop offset="100%" stop-color="#00875A" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift-android-4-4-kitkat" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#00875A" flood-opacity="0.275"/>
