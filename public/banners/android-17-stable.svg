<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Android 17 stable release banner">
  <defs>
    <linearGradient id="a17-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="0B2B22"/>
    </linearGradient>
    <linearGradient id="a17-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#a17-bg)"/>

  <!-- Safe band: y=75..555. Nothing legible may leave it. -->
  <g opacity="0.10"><ellipse cx="900" cy="250" rx="110" ry="98" fill="#34D399"/><rect x="790" y="300" width="220" height="200" rx="28" fill="#34D399"/><rect x="726" y="310" width="44" height="150" rx="22" fill="#34D399"/><rect x="1030" y="310" width="44" height="150" rx="22" fill="#34D399"/></g>

  <rect x="96" y="150" width="76" height="4" rx="2" fill="url(#a17-accent)"/>
  <text x="96" y="205" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="26" letter-spacing="4" fill="#34D399">ANDROID 17 · API 37</text>
  <text x="96" y="300" font-family="Switzer,'Helvetica Neue',sans-serif" font-size="72" font-weight="500" letter-spacing="-2" fill="#F8FAFC">Stable, six</text>
  <text x="96" y="384" font-family="Switzer,'Helvetica Neue',sans-serif" font-size="72" font-weight="500" letter-spacing="-2" fill="#94A3B8">weeks in</text>
  <text x="96" y="470" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="24" fill="#64748B">Beta 3 → Beta 4 → 16 Jun 2026</text>
</svg>
