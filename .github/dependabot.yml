# Cooldowns exist because the danger window for a supply-chain attack is the
# hours right after a malicious release lands, before it is yanked. Waiting a
# week costs nothing on a static site and skips most of that window. Both
# ecosystems wait the same 7 days: an action runs with the workflow's token, so
# it is no less of a supply-chain path than a package. zizmor's
# `dependabot-cooldown` audit (run in workflow-lint.yml) enforces the floor.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Land on the integration branch like every other change. Without this,
    # Dependabot opens against the default branch and quietly bypasses the
    # main + dev model, pushing dependency bumps straight at what publishes.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # astro check refuses TypeScript 7, so the bump breaks the whole build, not
    # just lint. Lift this once @astrojs/check supports it.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      # One PR per concern instead of a dozen: dev tooling churns constantly and
      # is not shipped to readers, so it does not deserve individual review.
      # Majors included: eslint and @eslint/js must move together — bumped
      # separately, each PR installs a version the other rejects and fails
      # before any code runs.
      dev-tooling:
        dependency-type: development
        update-types: [major, minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      # init and analyze read the same config and refuse to run at different
      # versions: "Loaded a configuration file for version X, but running
      # version Y". Bumped separately, each PR moves one line and every CodeQL
      # run fails until the other lands. They are one dependency, not two.
      codeql-action:
        patterns: [github/codeql-action*]
    labels: [dependencies, ci]
