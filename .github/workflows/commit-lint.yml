# Enforces one commit format: `type(scope): description`.
#
# Only the commits a pull request ADDS are checked. Twenty-eight commits in this
# repository predate the convention ("Update .gitignore", "protected bug"), and
# rewriting published history to satisfy a linter would cost more than the
# inconsistency. The rules live in scripts/check-commit-messages.ts so they are
# unit-tested and runnable locally with `bun run commits:check`.
name: Commit convention

on:
  pull_request:

permissions: {}

concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  subjects:
    name: Commit subjects and PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: the check needs the merge base to know which commits
          # belong to this pull request rather than to the branch it targets.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Check the commits this PR adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun run commits:check "$BASE..$HEAD"

      # A squash merge takes its subject from the PR title, so an unchecked
      # title would put a non-conforming commit on the branch anyway.
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bun run commits:check -- --title "$TITLE"
